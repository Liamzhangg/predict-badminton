[project]
name = "predict-badminton"
version = "0.1.0"
requires-python = ">=3.12.13"
dependencies = [
    "lightgbm>=4.0",
    "numpy>=1.24",
    "optuna>=3.3",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
fetch = ["curl-cffi>=0.13,<1"]
app = ["streamlit>=1.50,<2"]
benchmark = ["xgboost>=2.0"]
